<!DOCTYPE html>
<html lang="fr-FR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <title>Emryck Dore | Chef de projet digital & développeur Flutter</title>

  <meta name="description" content="Portfolio de projets digitaux : Flutter, gestion de projet, IoT, VR et applications metier.">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="index, follow">
  <meta name="google-site-verification" content="AKcdjme9Ddk2AOf6tkO_nsW4wjgCWJNaFsXZiMO1dfA" />

  <!-- IMPORTANT: base relative pour GitHub Pages -->

  <meta http-equiv="Content-Security-Policy"
        content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;
               img-src * data: blob: https://*.basemaps.cartocdn.com;
               connect-src * https://*.basemaps.cartocdn.com wss:;">

  <meta property="og:title" content="Emryck Dore | Portfolio">
  <meta property="og:description" content="Chef de projet digital & développeur Flutter">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://godzyken.github.io/portefolio/">

  <!-- ✅ PWA - Lien vers le manifest (C'ÉTAIT MANQUANT) -->
  <link rel="manifest" href="./manifest.json">
  
  <!-- PWA - Couleur de la barre de statut -->
  <meta name="theme-color" content="#0175C2">
  
  <!-- PWA - Support iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="portefolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Configuration Flutter obligatoire -->
  <script>
    window._flutter = {
      buildConfig: {
        renderer: "canvaskit",
        assetBase: "./",
      }
    };
  </script>

  <!-- Le bootloader Flutter -->
  <script src="./flutter.js" defer></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <!-- ✅ Service Worker pour PWA (optionnel mais recommandé) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./flutter_service_worker.js').then(function(registration) {
          console.log('✅ Service Worker enregistré avec succès');
        }).catch(function(error) {
          console.log('⚠️ Erreur lors de l\'enregistrement du Service Worker:', error);
        });
      });
    }
  </script>

</head>

<body>
<!-- Le code compilé -->
  <script src="./main.dart.js" type="application/javascript" defer></script>

  <model-viewer
          src="https://raw.githubusercontent.com/godzyken/portefolio/master/assets_source/models/perso_samurail.glb"
          camera-controls
          auto-rotate
          style="width: 102%; height: 700px;">
  </model-viewer>
</body>
</html>
