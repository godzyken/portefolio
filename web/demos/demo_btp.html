<body>
  <div id="root"></div>
  <script type="module">
    import React from 'https://esm.sh/react@18.3.1';
    import ReactDOM from 'https://esm.sh/react-dom@18.3.1/client';

    const c = React.createElement;

    // --- DATA ---
    const de = [
      { id: 0, num: "01", kicker: "LE CONSTAT", title: "LE BESOIN TERRAIN", subtitle: "L'artisan débordé.", desc: "Devis griffonnés, photos perdues. Le BTP mérite mieux.", accent: "CHAOS" },
      { id: 1, num: "02", kicker: "L'INTERVENTION", title: "L'ARRIVÉE DE GODZYKEN", subtitle: "Consultant AMOA.", desc: "Il n'impose pas, il comprend vos processus réels.", accent: "AMOA" },
      { id: 2, num: "03", kicker: "CONCEPTION", title: "CONSTRUCTION 4.0", subtitle: "By Flutter.", desc: "Une app unique, pensée pour les gants et la poussière.", accent: "FLUTTER" },
      { id: 3, num: "04", kicker: "EXÉCUTION", title: "FABRICATION AGILE", subtitle: "On code sur chantier.", desc: "Sprints courts, tests utilisateurs en conditions réelles.", accent: "AGILE" },
      { id: 4, num: "05", kicker: "L'IMPACT", title: "SOLUTION IMPACTANTE", subtitle: "Moins d'admin.", desc: "L'artisan redevient artisan. Zéro papier perdu.", accent: "IMPACT" }
    ];

    function Ci() {
      const [step, setStep] = React.useState(0);
      const [isTeaser, setIsTeaser] = React.useState(true);
      const [teaserStep, setTeaserStep] = React.useState(0);

      // Detection du chemin de base pour les assets
      const baseUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/')) + '/..';

      const teaserBanners = [
        { src: `${baseUrl}/assets/images/services/btp_workflow_blueprint.webp`, title: "1. LE BESOIN TERRAIN" },
        { src: `${baseUrl}/assets/images/services/godzyken_amoa_ecoute_terrain_flowchart_banner.webp`, title: "2. L'ÉCOUTE TERRAIN" },
        { src: `${baseUrl}/assets/images/services/fabrication_flutter_construction_4_0.webp`, title: "3. FABRICATION FLUTTER" },
        { src: `${baseUrl}/assets/images/services/to_solution_impact_banner.webp`, title: "4. SOLUTION IMPACTANTE" }
      ];

      React.useEffect(() => {
        if (!isTeaser) return;
        const timer = setTimeout(() => {
          if (teaserStep < teaserBanners.length - 1) {
            setTeaserStep(s => s + 1);
          }
        }, 4000);
        return () => clearTimeout(timer);
      }, [isTeaser, teaserStep]);

      if (isTeaser) {
        return c("div", {
          className: "fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center transition-all duration-700 overflow-hidden",
          style: { touchAction: 'none' }
        }, [
          c("div", { className: "absolute inset-0", key: "bg" }, [
            c("img", {
              src: teaserBanners[teaserStep].src,
              className: "w-full h-full object-cover opacity-40 transition-opacity duration-1000",
              alt: teaserBanners[teaserStep].title,
              onError: (e) => {
                console.error("Failed to load teaser image:", teaserBanners[teaserStep].src);
                // Fallback si l'image ne charge pas
                e.target.style.display = 'none';
              }
            }),
            c("div", { className: "absolute inset-0 bg-gradient-to-t from-black via-black/60 to-transparent" })
          ]),
          c("div", { className: "relative z-10 flex flex-col items-center text-center px-6 w-full max-w-[800px]", key: "content" }, [
            c("div", { className: "text-[#FF6B2B] text-[14px] md:text-[18px] tracking-[0.4em] mb-8 font-bold animate-pulse" }, "STRATÉGIE AMOA"),
            c("h2", { className: "text-[32px] md:text-[64px] font-bold text-white mb-10 tracking-tight leading-tight" }, teaserBanners[teaserStep].title),
            c("div", { className: "flex gap-4 justify-center mb-16" }, teaserBanners.map((_, idx) =>
              c("div", {
                key: idx,
                className: `h-2 rounded-full transition-all duration-700 ${idx === teaserStep ? "w-20 bg-[#FF6B2B]" : "w-6 bg-white/20"}`
              })
            )),
            c("div", { className: "flex flex-col md:flex-row gap-6 items-center justify-center w-full" }, [
              teaserStep < teaserBanners.length - 1 ?
                c("button", {
                  onClick: () => setTeaserStep(s => s + 1),
                  className: "px-14 py-5 rounded-full border-2 border-[#FF6B2B] text-white font-bold hover:bg-[#FF6B2B]/20 transition-all uppercase tracking-widest",
                  key: "next"
                }, "SUIVANT") :
                c("button", {
                  onClick: () => {
                    console.log("Demo Start triggered");
                    setIsTeaser(false);
                  },
                  className: "px-16 py-6 rounded-full bg-[#FF6B2B] text-black font-black text-[18px] hover:scale-110 transition-transform shadow-[0_0_50px_rgba(255,107,43,0.6)] uppercase tracking-tighter",
                  key: "start"
                }, "LANCER LA DÉMO INTERACTIVE"),
              c("button", {
                onClick: () => setIsTeaser(false),
                className: "px-10 py-5 rounded-full text-white/40 hover:text-white transition-colors font-semibold uppercase tracking-widest text-[12px]",
                key: "skip"
              }, "IGNORER L'INTRO")
            ])
          ])
        ]);
      }

      // --- MAIN DEMO CONTENT ---
      return c("div", { className: "relative w-full min-h-screen bg-[#0C0F14] text-white flex flex-col items-center justify-center p-10 text-center" }, [
        c("h1", { className: "text-6xl font-bold text-[#FF6B2B] mb-6" }, "DÉMO CONSTRUCTION 4.0"),
        c("p", { className: "text-xl text-white/70 max-w-2xl" }, "L'environnement interactif complet est en cours d'initialisation. Cette démo simule le pilotage d'un chantier numérisé via Flutter."),
        c("button", {
          onClick: () => window.location.reload(),
          className: "mt-12 px-10 py-4 bg-white text-black font-bold rounded-full hover:bg-white/90 transition-colors"
        }, "RETOUR AU DÉBUT")
      ]);
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(c(Ci));
  </script>
</body>
