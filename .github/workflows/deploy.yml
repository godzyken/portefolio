name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Évite les déploiements concurrents
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image assets
        run: |
          echo "Setting up Python environment..."
          pip install Pillow tqdm
          
          echo "Generating image assets from source..."
          python generate_all_assets_variants.py
          echo "✅ Image assets generated."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # ✅ Validation des secrets (optionnel mais recommandé)
      - name: Validate environment variables
        run: |
          echo "Checking required secrets..."
          test -n "${{ secrets.EMAILJS_SERVICE_ID }}" || echo "⚠️ EMAILJS_SERVICE_ID missing"
          test -n "${{ secrets.EMAILJS_TEMPLATE_ID }}" || echo "⚠️ EMAILJS_TEMPLATE_ID missing"
          test -n "${{ secrets.EMAILJS_PUBLIC_KEY }}" || echo "⚠️ EMAILJS_PUBLIC_KEY missing"
          test -n "${{ secrets.WHATSAPP_PHONE }}" || echo "⚠️ WHATSAPP_PHONE missing"
          test -n "${{ secrets.CV_ONEDRIVE_URL }}" || echo "⚠️ CV_ONEDRIVE_URL missing"
          test -n "${{ secrets.MAPS_API_KEY }}" && echo "✅ MAPS_API_KEY configured" || echo "ℹ️ MAPS_API_KEY optional"
          test -n "${{ secrets.WAKATIME_API_KEY }}" && echo "✅ WAKATIME_API_KEY configured" || echo "ℹ️ WAKATIME_API_KEY optional"
          test -n "${{ secrets.PORTFOLIO_GITHUB_TOKEN }}" && echo "✅ PORTFOLIO_GITHUB_TOKEN configured" || echo "ℹ️ PORTFOLIO_GITHUB_TOKEN optional (60 req/h sans lui au lieu de 5000)"
          test -n "${{ secrets.SUPABASE_URL }}" || echo "⚠️ SUPABASE_URL missing (tarifs figés sur le JSON local)"
          test -n "${{ secrets.SUPABASE_ANON_KEY }}" || echo "⚠️ SUPABASE_ANON_KEY missing (tarifs figés sur le JSON local)"
          test -n "${{ secrets.TURNSTILE_SITE_KEY }}" || echo "⚠️ TURNSTILE_SITE_KEY missing"
          test -n "${{ secrets.OPENAI_API_KEY }}" && echo "✅ OPENAI_API_KEY configured" || echo "⚠️ OPENAI_API_KEY missing"
          test -n "${{ secrets.GCC_CLIENT_ID }}" && echo "✅ GCC_CLIENT_ID configured" || echo "⚠️ GCC_CLIENT_ID missing"
          test -n "${{ secrets.EMAILJS_PROJECT_TEMPLATE_ID }}" && echo "✅ EMAILJS_PROJECT_TEMPLATE_ID configured" || echo "ℹ️ EMAILJS_PROJECT_TEMPLATE_ID optional"

      # ✅ Build avec TOUTES les variables d'environnement
      - name: Build Flutter web
        run: |
          flutter build web \
            --release \
            --base-href="/portefolio/" \
            --dart-define=EMAILJS_SERVICE_ID="${{ secrets.EMAILJS_SERVICE_ID }}" \
            --dart-define=EMAILJS_TEMPLATE_ID="${{ secrets.EMAILJS_TEMPLATE_ID }}" \
            --dart-define=EMAILJS_PUBLIC_KEY="${{ secrets.EMAILJS_PUBLIC_KEY }}" \
            --dart-define=WHATSAPP_PHONE="${{ secrets.WHATSAPP_PHONE }}" \
            --dart-define=CV_ONEDRIVE_URL="${{ secrets.CV_ONEDRIVE_URL }}" \
            --dart-define=MAPS_API_KEY="${{ secrets.MAPS_API_KEY }}" \
            --dart-define=WAKATIME_API_KEY="${{ secrets.WAKATIME_API_KEY }}" \
            --dart-define=GITHUB_TOKEN="${{ secrets.PORTFOLIO_GITHUB_TOKEN }}" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=TURNSTILE_SITE_KEY="${{ secrets.TURNSTILE_SITE_KEY }}" \
            --dart-define=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --dart-define=GCC_CLIENT_ID="${{ secrets.GCC_CLIENT_ID }}" \
            --dart-define=EMAILJS_PROJECT_TEMPLATE_ID="${{ secrets.EMAILJS_PROJECT_TEMPLATE_ID }}"

      # Cache busting
      - name: Append build version (cache busting)
        run: |
          BUILD_VERSION=$(date +%s)
          sed -i "s/flutter_bootstrap.js/flutter_bootstrap.js?v=${BUILD_VERSION}/" build/web/index.html
          sed -i "s/main.dart.js/main.dart.js?v=${BUILD_VERSION}/" build/web/index.html
          echo "Build version: ${BUILD_VERSION}"

      # Optimisation : compression des assets
      - name: Compress assets (optional)
        run: |
          if command -v gzip &> /dev/null; then
            find build/web -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) -exec gzip -k -9 {} \;
            echo "✅ Assets compressed"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Post-déploiement : notification (optionnel)
      - name: Deployment success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 URL: ${{ steps.deployment.outputs.page_url }}"
